{% extends "users/base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Welcome, {{ user.username }}!</h1>
    <p class="text-gray-600 mb-6">Email: {{ user.email }}</p>
    <div class="border-t pt-6">
        <p class="text-sm text-gray-500">This is your protected dashboard. Only logged-in users can see this.</p>
    </div>
</div>
{% endblock %}
