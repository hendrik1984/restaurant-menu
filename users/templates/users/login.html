{% extends "users/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Log In</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                    {{ field.label }}
                </label>
                <input type="{{ field.field.widget.input_type }}"
                       name="{{ field.name }}"
                       id="{{ field.id_for_label }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       {% if field.field.required %}required{% endif %}>
                {% for error in field.errors %}
                    <p class="text-xs text-red-500 mt-1">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-medium">
            Log In
        </button>
    </form>
    <p class="text-sm text-gray-600 mt-4 text-center">
        Don't have an account? <a href="{% url 'signup' %}" class="text-blue-600 hover:underline">Sign up</a>
    </p>
</div>
{% endblock %}
